<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GENIE FX LIVE TICKER</title>

<style>
body {
    margin:0;
    background:black;
    overflow:hidden;
    font-family: Arial;
}

.ticker {
    position:absolute;
    white-space:nowrap;
    color:#b026ff;
    font-size:60px;
    font-weight:bold;
    animation: scroll 20s linear infinite;
    top:30%;
}

@keyframes scroll {
    0% { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
}

.small {
    font-size:40px;
    color:#ffffff;
}
</style>
</head>

<body>

<div class="ticker" id="ticker">
Loading live market...
</div>

<script>

// ---------- CONFIG ----------
const refreshTime = 5000;

// ---------- FETCH GOLD PRICE (XAUUSD) ----------
async function getGold() {
    try {
        let res = await fetch("https://api.metals.live/v1/spot/gold");
        let data = await res.json();
        return data[0].price;
    } catch (e) {
        return "N/A";
    }
}

// ---------- FETCH FX RATES ----------
async function getFX() {
    try {
        let res = await fetch("https://open.er-api.com/v6/latest/USD");
        let data = await res.json();
        return data.rates;
    } catch (e) {
        return null;
    }
}

// ---------- UPDATE TICKER ----------
async function updateTicker() {

    let gold = await getGold();
    let fx = await getFX();

    let eur = fx ? fx.EUR.toFixed(4) : "N/A";
    let gbp = fx ? fx.GBP.toFixed(4) : "N/A";
    let aed = fx ? fx.AED.toFixed(4) : "N/A";

    document.getElementById("ticker").innerHTML =
        "🟣 GENIE FX LIVE | " +
        "XAUUSD: " + gold + " | " +
        "EURUSD: " + eur + " | " +
        "GBPUSD: " + gbp + " | " +
        "USDAED: " + aed + " | " +
        "SPREAD LOW • FAST EXECUTION • GENIE LTD";
}

// ---------- LOOP ----------
updateTicker();
setInterval(updateTicker, refreshTime);

</script>

</body>
</html>
