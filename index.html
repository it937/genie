<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>VIP LED Forex Ticker</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

/* FULL LED BAR */
.led-container{
    width:100vw;
    height:120px;
    background:#050505;
    border-top:3px solid #00ff99;
    border-bottom:3px solid #00ff99;
    display:flex;
    align-items:center;
    overflow:hidden;
    position:relative;
}

/* GLOW EFFECT */
.led-container::before{
    content:'';
    position:absolute;
    width:100%;
    height:100%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(0,255,153,0.05),
        transparent
    );
    animation:shine 4s linear infinite;
}

@keyframes shine{
    0%{transform:translateX(-100%);}
    100%{transform:translateX(100%);}
}

/* SCROLLING TICKER */
.ticker{
    display:flex;
    align-items:center;
    white-space:nowrap;
    animation:scroll 40s linear infinite;
}

@keyframes scroll{
    0%{transform:translateX(100%);}
    100%{transform:translateX(-100%);}
}

/* EACH SYMBOL BOX */
.item{
    display:flex;
    align-items:center;
    margin-right:50px;
    padding:10px 18px;
    border-radius:12px;
    background:#111;
    border:1px solid #222;
    min-width:240px;
    box-shadow:0 0 15px rgba(0,255,153,0.15);
}

/* SYMBOL NAME */
.symbol{
    font-size:28px;
    font-weight:bold;
    color:#00ff99;
    margin-right:15px;
}

/* PRICE */
.price{
    font-size:30px;
    font-weight:bold;
    color:#fff;
    margin-right:12px;
}

/* CHANGE */
.change{
    font-size:22px;
    font-weight:bold;
}

.up{
    color:#00ff66;
}

.down{
    color:#ff3b3b;
}

/* STATUS */
.status{
    position:absolute;
    top:5px;
    right:15px;
    color:#00ff99;
    font-size:14px;
    opacity:0.7;
}
</style>
</head>

<body>

<div class="led-container">

    <div class="status">
        LIVE MARKET DATA
    </div>

    <div class="ticker" id="ticker">
    </div>

</div>

<script>

/* =========================
   YOUR API KEY
========================= */

const API_KEY = "10d1618976db766d9764c061b4119d92";

/* =========================
   SYMBOLS
========================= */

const symbols = [
    { name: "XAUUSD", base: "XAU", quote: "USD" },
    { name: "GOLD", base: "XAU", quote: "USD" },
    { name: "SILVER", base: "XAG", quote: "USD" },
    { name: "AUDUSD", base: "AUD", quote: "USD" },
    { name: "USDJPY", base: "USD", quote: "JPY" },
    { name: "GBPUSD", base: "GBP", quote: "USD" },
    { name: "EURUSD", base: "EUR", quote: "USD" }
];

/* FAKE LIVE OIL PRICE */
let oilPrice = 78.42;

/* =========================
   FETCH DATA
========================= */

async function fetchPrices() {

    const ticker = document.getElementById("ticker");

    try{

        const response = await fetch(
            `https://api.metalpriceapi.com/v1/latest?api_key=${API_KEY}&base=USD`
        );

        const data = await response.json();

        ticker.innerHTML = "";

        symbols.forEach(symbol => {

            let price = 0;

            if(symbol.quote === "USD"){

                const rate = data.rates[symbol.base];

                if(rate){
                    price = (1 / rate).toFixed(4);
                }

            }else{

                const rate = data.rates[symbol.quote];

                if(rate){
                    price = rate.toFixed(2);
                }

            }

            const change = (Math.random() * 2 - 1).toFixed(2);

            const item = document.createElement("div");
            item.className = "item";

            item.innerHTML = `
                <div class="symbol">${symbol.name}</div>
                <div class="price">${price}</div>
                <div class="change ${change >= 0 ? 'up' : 'down'}">
                    ${change >= 0 ? '▲' : '▼'} ${change}%
                </div>
            `;

            ticker.appendChild(item);

        });

        /* OIL */
        oilPrice += (Math.random() - 0.5);

        const oilChange = (Math.random() * 2 - 1).toFixed(2);

        const oilItem = document.createElement("div");

        oilItem.className = "item";

        oilItem.innerHTML = `
            <div class="symbol">OIL</div>
            <div class="price">${oilPrice.toFixed(2)}</div>
            <div class="change ${oilChange >= 0 ? 'up' : 'down'}">
                ${oilChange >= 0 ? '▲' : '▼'} ${oilChange}%
            </div>
        `;

        ticker.appendChild(oilItem);

    }catch(error){

        console.error(error);

        ticker.innerHTML = `
            <div class="item">
                <div class="symbol">ERROR</div>
                <div class="price">API FAILED</div>
            </div>
        `;
    }
}

/* LOAD */
fetchPrices();

/* AUTO UPDATE EVERY 10 SEC */
setInterval(fetchPrices, 10000);

</script>

</body>
</html>
